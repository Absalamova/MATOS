# /etc/nginx/sites-available/matos  →  ln -s ../sites-available/matos /etc/nginx/sites-enabled/
# HTTPS: sudo certbot --nginx -d api.matos.uz -d admin.matos.uz

limit_req_zone $binary_remote_addr zone=matos_api:10m rate=20r/s;

# ── API: api.matos.uz → Node (127.0.0.1:8080)
server {
    listen 80;
    server_name api.matos.uz;

    client_max_body_size 10m;          # admin photo uploads (API limit is 8 MB)
    gzip on;
    gzip_types application/json text/csv;

    location / {
        limit_req zone=matos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Seller panel: admin.matos.uz → static files from `npm run build:admin`
server {
    listen 80;
    server_name admin.matos.uz;

    root /var/www/matos-admin;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # nginx drops server-level add_header inside a location that sets its own, so headers live here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
